name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Ruff (backend)
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          ruff check .

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: ESLint (frontend)
        working-directory: frontend
        run: |
          npm ci
          npm run lint
  build:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: samo-za-build
      DATABASE_URL: postgres://build:build@localhost:5432/build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Namestitev odvisnosti
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Preverjanje in zbiranje statičnih datotek
        working-directory: backend
        run: |
          python manage.py check
          python manage.py collectstatic --noinput

      - name: Paket aplikacije
        run: |
          mkdir -p paket/frontend
          tar --exclude='__pycache__' --exclude='.env' --exclude='venv' --exclude='.ruff_cache' --exclude='tests.py' --exclude='test_*.py' -cf - backend | tar -xf - -C paket
          cp -r frontend/templates frontend/static paket/frontend/

      - uses: actions/upload-artifact@v4
        with:
          name: aplikacija
          path: paket/
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: karrabimzagym
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: samo-za-teste
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/karrabimzagym
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Testi backenda s pokritostjo
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          coverage run manage.py test
          coverage report
          coverage html -d coverage-html
          coverage xml

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Testi frontenda s pokritostjo
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pokritost-testov
          path: |
            backend/coverage-html/
            backend/coverage.xml
            frontend/coverage/
          retention-days: 7
